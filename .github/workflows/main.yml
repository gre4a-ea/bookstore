name: Java CI with Maven

on:
  push:
    branches: [ master ]   # или main, если у вас главная ветка main
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub предоставит виртуальную машину с Ubuntu

    steps:
      - uses: actions/checkout@v4   # скачивает код репозитория

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'   # OpenJDK от Adoptium

      - name: Build with Maven
        run: mvn clean package --file pom.xml   # запуск сборки
